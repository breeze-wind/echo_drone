/**:
  ros__parameters:
    # Minimal PX4 MAVROS profile for Echo Drone external-vision bringup.
    # Keep plugin scope narrow so hardware tests do not load unrelated MAVROS extras.
    plugin_allowlist:
      - sys_status
      - sys_time
      - command
      - vision_pose
      # ODOMETRY 使用独立 in/out 端点，供 SLS 读取 PX4 融合结果；避免启用
      # local_position 后与 vision_pose 共用 ~/pose 产生的回灌。
      - odometry
      - setpoint_position
      - setpoint_velocity
      - rc_io

    startup_px4_usb_quirk: false

    conn:
      heartbeat_rate: 1.0
      timeout: 10.0
      timesync_rate: 0.0
      system_time_rate: 0.0

    sys:
      min_voltage: 10.0
      disable_diag: false

    time:
      time_ref_source: "fcu"
      timesync_mode: MAVLINK
      timesync_avg_alpha: 0.6

    cmd:
      use_comp_id_system_control: false

    local_position:
      frame_id: "map"
      tf:
        send: false
        frame_id: "map"
        child_frame_id: "base_link"
        send_fcu: false

    vision_pose:
      tf:
        listen: false
        frame_id: "map"
        child_frame_id: "vision_estimate"
        rate_limit: 10.0

    # MAVROS 2.4.0 runs odometry as the separate /mavros/odometry node.  Its
    # parameters are named fcu.odom_*, not odometry.fcu.odom_*.  The wildcard
    # node selector above therefore has to provide fcu at this root level.
    # Explicitly override the upstream 2.4.0 child-frame default typo ("map").
    fcu:
      odom_parent_id_des: "map"
      odom_child_id_des: "base_link"

    setpoint_position:
      tf:
        listen: false
        frame_id: "map"
        child_frame_id: "target_position"
        rate_limit: 50.0
      mav_frame: LOCAL_NED

    setpoint_velocity:
      mav_frame: LOCAL_NED
