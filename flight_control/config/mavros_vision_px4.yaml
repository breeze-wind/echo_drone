/**:
  ros__parameters:
    # Minimal PX4 MAVROS profile for Echo Drone external-vision bringup.
    # Keep plugin scope narrow so hardware tests do not load unrelated MAVROS extras.
    plugin_allowlist:
      - sys_status
      - sys_time
      - command
      - local_position
      - vision_pose
      - setpoint_position
      - setpoint_velocity
      - rc_io

    startup_px4_usb_quirk: false

    conn:
      heartbeat_rate: 1.0
      timeout: 10.0
      timesync_rate: 0.0
      system_time_rate: 0.0

    sys:
      min_voltage: 10.0
      disable_diag: false

    time:
      time_ref_source: "fcu"
      timesync_mode: MAVLINK
      timesync_avg_alpha: 0.6

    cmd:
      use_comp_id_system_control: false

    local_position:
      frame_id: "map"
      tf:
        send: false
        frame_id: "map"
        child_frame_id: "base_link"
        send_fcu: false

    vision_pose:
      tf:
        listen: false
        frame_id: "map"
        child_frame_id: "vision_estimate"
        rate_limit: 10.0

    setpoint_position:
      tf:
        listen: false
        frame_id: "map"
        child_frame_id: "target_position"
        rate_limit: 50.0
      mav_frame: LOCAL_NED

    setpoint_velocity:
      mav_frame: LOCAL_NED
